# Netlify build config for the WKC ROAS dashboard.
# This site does not have a "Base directory" set, so this config file's
# publish/functions paths are resolved relative to the repo root even though
# the file itself lives inside artifacts/roas-dashboard — hence the
# "artifacts/roas-dashboard/" prefix below. The build command runs from the
# repo root too, which is required for the pnpm workspace filter to resolve.
[build]
  command = "pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @workspace/roas-dashboard run build"
  publish = "artifacts/roas-dashboard/dist/public"
  functions = "artifacts/roas-dashboard/netlify/functions"

[build.environment]
  PORT = "5175"
  BASE_PATH = "/"

# `netlify dev` proxies the Vite dev server; without this it assumes Vite's
# default port (5173) instead of the PORT set above.
[dev]
  command = "pnpm run dev"
  targetPort = 5175
  framework = "#custom"

# SPA fallback: serve index.html for any path that isn't a built asset.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
